<script>
	function butforreg() {
		if (document.getElementById('reg').value != "" && localStorage.getItem('name') == null){
			namenick = document.getElementById('reg').value;
			document.getElementById('nickname').textContent = namenick;
			localStorage.setItem('name', namenick);
			document.getElementById('in').style.display = 'none';
			document.getElementById('openin').style.display = 'none';
			document.getElementById('regfon').style.display = 'none';
			document.getElementById('reg').value = '';
			document.getElementById('vhod').value = '';
		}

		}
	}
	function butforvhod() {
		if (localStorage.getItem('name') != document.getElementById('vhod').value && document.getElementById('vhod').value != ""){

			document.getElementById('openin').style.display = 'none';
			document.getElementById('regfon').style.display = 'none';

			document.getElementById('vhod').value = '';

	}

	Myotve = {

	};

	function otvet(x) {
		if (Myotve.otve == 0){

			}else{

					Myotve.otve = x[1] + "," + x[0];
				}else{

				}
			}
			return;
		}
		otv = document.getElementById('answer').value;
		if (otv == Myotve.otve){
			document.getElementById('result').textContent = "Правильно!";
			Myotve.otve = 0;
			setTimeout(nwyr, 1500);
		}else if (otv != ""){

		}
		
	}

		Myotve.otve = 0;
		if (j == 1){

		document.getElementById('four').style.color = 'white';
		i = 1;
		while (i > 0) {
			if (Math.random() > 0.5){
				a = Math.round(Math.random() * (10 - 1) + 1) *(-1);
				opa = "-";
			}else{
				a = Math.round(Math.random() * (10 - 1) + 1);
				opa = "";

			if (Math.random() > 0.5){
				b = Math.round(Math.random() * (10 - 1) + 1) *(-1);
				opb = "-";

				opc = "-";
			}else{
				c = Math.round(Math.random() * (10 - 1) + 1);
				opc = "";

			if (Math.random() > 0.5){

			}else{
				d = Math.round(Math.random() * (10 - 1) + 1);

			}
			if ((((d - b)/(a - c))*1000)%1 == 0 && ((d - b)/(a - c)) != 0){
